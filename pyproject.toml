[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcx-trading-engine"
version = "0.1.0"
description = "Paper-trading-safe foundation for an MCX volatility trading engine"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
